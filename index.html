<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kinnaram - Connect & Chat</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #ff758c 0%, #ff7eb3 100%);
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box;
        }
        .app-container {
            background: white; width: 360px; position: relative;
            border-radius: 20px; box-shadow: 0 15px 30px rgba(0,0,0,0.2);
            padding: 20px; text-align: center; box-sizing: border-box;
        }
        h2 { color: #ff4757; margin-top: 0; }
        .nav-tabs { display: flex; gap: 10px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 8px; border: none; background: #eee; border-radius: 10px; cursor: pointer; font-weight: bold; }
        .tab-btn.active { background: #ff4757; color: white; }
        
        .card-container { min-height: 380px; display: flex; align-items: center; justify-content: center; }
        .profile-card {
            background: #fff; border: 1px solid #eee; border-radius: 15px;
            overflow: hidden; width: 100%; text-align: left; box-shadow: 0 4px 10px rgba(0,0,0,0.05);
        }
        .profile-card img { width: 100%; height: 220px; object-fit: cover; }
        .profile-info { padding: 15px; }
        .profile-info h3 { margin: 0 0 5px 0; color: #2f3542; }
        .profile-info p { margin: 4px 0; color: #57606f; font-size: 14px; }
        
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn {
            flex: 1; padding: 10px; border: none; border-radius: 25px;
            font-size: 14px; font-weight: bold; cursor: pointer; transition: 0.2s;
        }
        .btn-dislike { background: #e0e0e0; color: #333; }
        .btn-like { background: #ff4757; color: white; }
        .btn-chat { background: #2ed573; color: white; }
        
        /* Form Styling */
        .form-group { text-align: left; margin-bottom: 12px; }
        .form-group label { font-size: 12px; font-weight: bold; color: #555; }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%; padding: 8px; margin-top: 4px; border: 1px solid #ccc; border-radius: 8px; box-sizing: border-box;
        }
        .btn-submit { background: #2ed573; color: white; width: 100%; padding: 10px; border: none; border-radius: 10px; font-size: 16px; font-weight: bold; cursor: pointer; }

        /* Chat Window UI */
        #chat-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: white; border-radius: 20px; box-sizing: border-box; padding: 15px;
            flex-direction: column; justify-content: space-between; z-index: 10;
        }
        .chat-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 8px; }
        .chat-header h4 { margin: 0; color: #2f3542; }
        .call-btn-group { display: flex; gap: 8px; }
        .icon-btn { background: #f1f2f6; border: none; padding: 6px 10px; border-radius: 50%; cursor: pointer; font-size: 16px; }
        .chat-body { flex-grow: 1; overflow-y: auto; padding: 10px 0; text-align: left; display: flex; flex-direction: column; gap: 8px; }
        .msg { max-width: 75%; padding: 8px 12px; border-radius: 12px; font-size: 13px; }
        .msg.sent { background: #ff4757; color: white; align-self: flex-end; }
        .msg.received { background: #e0e0e0; color: #333; align-self: flex-start; }
        .chat-input-area { display: flex; gap: 8px; }
        .chat-input-area input { flex: 1; padding: 8px; border: 1px solid #ccc; border-radius: 15px; }
        .chat-input-area button { background: #ff4757; border: none; color: white; border-radius: 15px; padding: 0 15px; cursor: pointer; font-weight: bold; }

        /* Call Screen UI */
        #call-modal {
            display: none; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: #1e1e2e; color: white; border-radius: 20px; box-sizing: border-box;
            padding: 20px; flex-direction: column; align-items: center; justify-content: space-between; z-index: 20;
        }
        .avatar-circle { width: 100px; height: 100px; border-radius: 50%; overflow: hidden; margin-top: 30px; border: 3px solid #ff4757; }
        .avatar-circle img { width: 100%; height: 100%; object-fit: cover; }
        .btn-end-call { background: #ff4757; color: white; border: none; padding: 12px 30px; border-radius: 25px; font-weight: bold; cursor: pointer; margin-bottom: 20px; }
    </style>
</head>
<body>

<!-- Login Modal Window -->
<div id="login-modal" style="position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); display: flex; justify-content: center; align-items: center; z-index: 100;">
    <div style="background: white; padding: 30px; border-radius: 20px; text-align: center; width: 300px; box-shadow: 0 10px 25px rgba(0,0,0,0.3);">
        <h2>❤️ Kinnaram</h2>
        <p style="color: #666; font-size: 14px; margin-bottom: 20px;">കേരളത്തിലെ ആളുകളെ കണ്ടുമുട്ടാൻ ലോഗിൻ ചെയ്യൂ</p>
        <button onclick="loginWithGoogle()" style="background: #4285F4; color: white; border: none; padding: 12px 20px; border-radius: 25px; font-weight: bold; cursor: pointer; width: 100%; font-size: 15px;">
            🚀 Login with Google
        </button>
    </div>
</div>

<div class="app-container">
    <h2>❤️ Kinnaram</h2>
    
    <div class="nav-tabs">
        <button class="tab-btn active" id="btn-explore" onclick="switchTab('explore')">Explore</button>
        <button class="tab-btn" id="btn-add" onclick="switchTab('add')">+ Add Profile</button>
    </div>

    <!-- Explore Section -->
    <div id="explore-view">
        <div class="card-container" id="card-slot">
            <p>Loading profiles...</p>
        </div>
        <div class="actions">
            <button class="btn btn-dislike" onclick="nextProfile(false)">👎 Pass</button>
            <button class="btn btn-chat" onclick="openChat()">💬 Chat</button>
            <button class="btn btn-like" onclick="nextProfile(true)">❤️ Like</button>
        </div>
    </div>

    <!-- Create Profile Section -->
    <div id="add-view" style="display: none;">
        <form id="profileForm" onsubmit="saveProfile(event)">
            <div class="form-group">
                <label>Name</label>
                <input type="text" id="name" required placeholder="Ex: Rahul">
            </div>
            <div class="form-group">
                <label>Age</label>
                <input type="number" id="age" required placeholder="Ex: 25">
            </div>
            <div class="form-group">
                <label>Location (Kerala District)</label>
                <select id="location" required>
                    <option value="">Select District</option>
                    <option value="Kochi">Kochi / Ernakulam</option>
                    <option value="Trivandrum">Trivandrum</option>
                    <option value="Calicut">Calicut / Kozhikode</option>
                    <option value="Thrissur">Thrissur</option>
                    <option value="Kottayam">Kottayam</option>
                    <option value="Kannur">Kannur</option>
                    <option value="Kollam">Kollam</option>
                    <option value="Palakkad">Palakkad</option>
                    <option value="Alappuzha">Alappuzha</option>
                    <option value="Malappuram">Malappuram</option>
                    <option value="Pathanamthitta">Pathanamthitta</option>
                    <option value="Idukki">Idukki</option>
                    <option value="Wayanad">Wayanad</option>
                    <option value="Kasaragod">Kasaragod</option>
                </select>
            </div>
            <div class="form-group">
                <label>Photo Image URL</label>
                <input type="url" id="photo_url" placeholder="https://example.com/photo.jpg">
            </div>
            <div class="form-group">
                <label>Bio</label>
                <textarea id="bio" rows="3" required placeholder="Tell something about yourself..."></textarea>
            </div>
            <button type="submit" class="btn-submit">Create Profile</button>
        </form>
    </div>

    <!-- Chat Modal Window -->
    <div id="chat-modal">
        <div class="chat-header">
            <h4 id="chat-user-name">Chat</h4>
            <div class="call-btn-group">
                <button class="icon-btn" onclick="startCall('Voice')">📞</button>
                <button class="icon-btn" onclick="startCall('Video')">📹</button>
                <button class="icon-btn" onclick="closeChat()">❌</button>
            </div>
        </div>
        <div class="chat-body" id="chat-messages">
            <div class="msg received">Hey there! 👋</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-text" placeholder="Type a message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <!-- Call Overlay Modal -->
    <div id="call-modal">
        <div>
            <h3 id="call-type-title">Voice Call</h3>
            <p style="color:#aaa; font-size:12px;">Calling...</p>
        </div>
        <div class="avatar-circle">
            <img id="call-user-img" src="" alt="User">
        </div>
        <h3 id="call-user-name">User Name</h3>
        <button class="btn-end-call" onclick="endCall()">End Call 🔴</button>
    </div>
</div>

<!-- Firebase SDK Setup -->
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>

<script>
    let profiles = [];
    let currentIndex = 0;
    const currentUserId = 1;

    if (!firebase.apps.length) {
        firebase.initializeApp(firebaseConfig);
    }
    const auth = firebase.auth();
    const provider = new firebase.auth.GoogleAuthProvider();

  const firebaseConfig = {
  apiKey: "AIzaSyCJaKi1UUc7p2CXfFjpaFkStvKqd2kcDOM",
  authDomain: "kinnaram.firebaseapp.com",
  projectId: "kinnaram",
  storageBucket: "kinnaram.firebasestorage.app",
  messagingSenderId: "426509746066",
  appId: "1:426509746066:web:622d9f74936b9c600c4b4b",
  measurementId: "G-VCJVYQ2YDR"
};
    }

    function switchTab(tab) {
        if (tab === 'explore') {
            document.getElementById('explore-view').style.display = 'block';
            document.getElementById('add-view').style.display = 'none';
            document.getElementById('btn-explore').classList.add('active');
            document.getElementById('btn-add').classList.remove('active');
        } else {
            document.getElementById('explore-view').style.display = 'none';
            document.getElementById('add-view').style.display = 'block';
            document.getElementById('btn-add').classList.add('active');
            document.getElementById('btn-explore').classList.remove('active');
        }
    }

    async function fetchProfiles() {
    try {
        const response = await fetch('https://kinnaram-backend.onrender.com/profiles');
        const data = await response.json();
        profiles = data.profiles;
        showProfile();
    } catch (err) {
        document.getElementById('card-slot').innerHTML = '<p style="color:red;">Failed to load profiles</p>';
    }

    function showProfile() {
        const slot = document.getElementById('card-slot');
        if (profiles.length === 0 || currentIndex >= profiles.length) {
            slot.innerHTML = '<p>🎉 No more profiles around you!</p>';
            return;
        }
        const user = profiles[currentIndex];
        const photo = user.photo_url ? user.photo_url : 'https://via.placeholder.com/300x200?text=No+Image';
        
        slot.innerHTML = `
            <div class="profile-card">
                <img src="${photo}" alt="${user.name}" onerror="this.src='https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=500&auto=format&fit=crop&q=60'">
                <div class="profile-info">
                    <h3>${user.name}, ${user.age}</h3>
                    <p>📍 <b>Location:</b> ${user.location}</p>
                    <p>📝 <b>Bio:</b> ${user.bio}</p>
                </div>
            </div>
        `;
    }

    async function nextProfile(isLike) {
        if (currentIndex < profiles.length && isLike) {
            const likedUser = profiles[currentIndex];
            try {
                const res = await fetch('http://127.0.0.1:8000/like', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ from_user_id: currentUserId, to_user_id: likedUser.id })
                });
                const result = await res.json();
                if (result.status === 'match') {
                    alert(`🎉 It's a Match with ${likedUser.name}!`);
                }
            } catch (e) {
                console.log("Error sending like:", e);
            }
        }
        currentIndex++;
        showProfile();
    }

    function openChat() {
        if (currentIndex >= profiles.length) return;
        const user = profiles[currentIndex];
        document.getElementById('chat-user-name').innerText = user.name;
        document.getElementById('chat-modal').style.display = 'flex';
    }

    function closeChat() {
        document.getElementById('chat-modal').style.display = 'none';
    }

    function sendMessage() {
        const input = document.getElementById('chat-text');
        const text = input.value.trim();
        if (!text) return;

        const msgs = document.getElementById('chat-messages');
        msgs.innerHTML += `<div class="msg sent">${text}</div>`;
        input.value = '';
        msgs.scrollTop = msgs.scrollHeight;

        setTimeout(() => {
            msgs.innerHTML += `<div class="msg received">Nice to talk to you! 😊</div>`;
            msgs.scrollTop = msgs.scrollHeight;
        }, 1000);
    }

    function startCall(type) {
        const user = profiles[currentIndex];
        document.getElementById('call-type-title').innerText = `${type} Call`;
        document.getElementById('call-user-name').innerText = user.name;
        document.getElementById('call-user-img').src = user.photo_url || 'https://via.placeholder.com/100';
        document.getElementById('call-modal').style.display = 'flex';
    }

    function endCall() {
        document.getElementById('call-modal').style.display = 'none';
    }

    async function saveProfile(event) {
        event.preventDefault();
        const payload = {
            name: document.getElementById('name').value,
            age: parseInt(document.getElementById('age').value),
            location: document.getElementById('location').value,
            photo_url: document.getElementById('photo_url').value,
            bio: document.getElementById('bio').value
        };

        try {
            const res = await fetch('http://127.0.0.1:8000/users/add', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            if (res.ok) {
                alert('Profile Created Successfully!');
                document.getElementById('profileForm').reset();
                fetchProfiles();
                switchTab('explore');
            }
        } catch (err) {
            alert('Failed to save profile!');
        }
    }

    fetchProfiles();
</script>

</body>
</html>
